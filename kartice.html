<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Картице — Милан и Нина</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Cormorant+SC:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold:       #C19A6B;
      --gold-light: #D4B896;
      --gold-dark:  #9A7A52;
      --cream:      #FAF7F2;
      --cream-dark: #F0EAE0;
      --text:       #1C1208;
      --text-mid:   #4A3A28;
      --text-muted: #7A6A58;
      --olive:      #4A5C33;
      --olive-dark: #2E3B1F;
      --border:     #DDD0B8;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: #E8E0D4;
      color: var(--text);
    }

    /* ── CONTROLS ───────────────────────────────────────────── */
    .controls {
      padding: 2rem;
      text-align: center;
      background: var(--olive-dark);
      color: var(--cream);
    }
    .controls h1 {
      font-family: 'Cormorant SC', serif;
      font-size: 1rem;
      letter-spacing: 0.4em;
      font-weight: 300;
      color: var(--gold-light);
      margin-bottom: 0.5rem;
    }
    .controls p {
      font-size: 0.85rem;
      color: rgba(250,247,242,0.55);
      margin-bottom: 1.25rem;
      letter-spacing: 0.05em;
    }
    .print-btn {
      display: inline-block;
      padding: 0.65rem 2rem;
      border: 1px solid rgba(193,154,107,0.6);
      color: var(--gold-light);
      font-family: 'Cormorant SC', serif;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      background: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .print-btn:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--olive-dark);
    }

    /* ── PAGE ───────────────────────────────────────────────── */
    .page {
      width: 210mm;
      min-height: 297mm;
      margin: 1.5rem auto;
      background: white;
      padding: 10mm;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      align-content: start;
    }

    /* ── TENT CARD ──────────────────────────────────────────── */
    /* 90mm × 60mm — fold at midpoint (30mm from top)
       Top half: back face (upside-down)
       Bottom half: front face (name + table) */
    .card-wrap {
      width: 90mm;
      height: 60mm;
      padding: 1.5mm;
      border: 0.3mm dashed #CCC;
    }

    .card {
      width: 100%;
      height: 100%;
      background: var(--cream);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Back (upside-down top half) */
    .card-back {
      height: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transform: rotate(180deg);
      padding: 2mm 4mm 1.5mm;
      gap: 1.5mm;
      position: relative;
    }
    .card-back::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 0.3mm;
      background: var(--border);
    }
    .back-ornament {
      color: var(--gold);
      font-size: 7pt;
      letter-spacing: 0.5em;
      opacity: 0.6;
    }
    .back-names {
      font-family: 'Cormorant SC', serif;
      font-size: 7pt;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* Fold indicator (screen only) */
    .fold-line {
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      height: 0;
      border-top: 0.5mm dashed var(--border);
      z-index: 10;
      pointer-events: none;
    }
    .fold-label {
      position: absolute;
      right: 2mm;
      top: 50%;
      transform: translateY(-50%);
      font-size: 5pt;
      color: #BBB;
      font-family: Arial, sans-serif;
      letter-spacing: 0.1em;
    }

    /* Front face */
    .card-front {
      height: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5mm 5mm 3mm;
      position: relative;
      gap: 1mm;
    }
    .card-front::before,
    .card-front::after {
      content: '';
      position: absolute;
      width: 5mm; height: 5mm;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.7;
    }
    .card-front::before { bottom: 1.5mm; left: 1.5mm; border-width: 0 0 0.5mm 0.5mm; }
    .card-front::after  { bottom: 1.5mm; right: 1.5mm; border-width: 0 0.5mm 0.5mm 0; }

    .corner-tl, .corner-tr {
      position: absolute;
      width: 4.5mm; height: 4.5mm;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.5;
    }
    .corner-tl { top: 1mm; left: 1mm;  border-width: 0.4mm 0 0 0.4mm; }
    .corner-tr { top: 1mm; right: 1mm; border-width: 0.4mm 0.4mm 0 0; }

    .guest-name {
      font-size: 16pt;
      font-weight: 300;
      font-style: italic;
      color: var(--text);
      line-height: 1.15;
      text-align: center;
      letter-spacing: 0.01em;
    }
    .guest-name.long  { font-size: 13pt; }
    .guest-name.vlong { font-size: 11pt; }

    .name-rule {
      width: 12mm; height: 0.3mm;
      background: var(--gold);
      opacity: 0.6;
    }

    .table-label {
      font-family: 'Cormorant SC', serif;
      font-size: 6.5pt;
      letter-spacing: 0.35em;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* ── INVITATION-STYLE (with background) ────────────────── */
    body.with-bg .card {
      background: var(--olive-dark);
    }
    body.with-bg .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('/img/lale_gold.png') center / cover no-repeat;
      opacity: 0.20;
      pointer-events: none;
      z-index: 0;
    }
    body.with-bg .card > * { position: relative; z-index: 1; }

    body.with-bg .guest-name  { color: var(--cream); }
    body.with-bg .table-label { color: var(--gold-light); }
    body.with-bg .back-names  { color: var(--gold-light); }
    body.with-bg .card-back::after { background: rgba(193,154,107,0.3); }
    body.with-bg .card-front::before,
    body.with-bg .card-front::after { opacity: 0.9; }
    body.with-bg .corner-tl,
    body.with-bg .corner-tr         { opacity: 0.7; }
    body.with-bg .name-rule         { opacity: 0.8; }

    /* ── PRINT ──────────────────────────────────────────────── */
    @media print {
      @page { size: A4 portrait; margin: 0; }
      body { background: white; }
      .controls { display: none; }
      .page { margin: 0; padding: 10mm; page-break-after: always; box-shadow: none; }
      .card-wrap { border-color: #DDD; }
      .fold-label { display: none; }
    }
  </style>
</head>
<body>

<div class="controls">
  <h1>Картице · Милан и Нина · 19. априла 2026.</h1>
  <p>Штампај на A4 · Исеци по испрекиданим линијама · Преломи по средњој линији</p>
  <button class="print-btn" onclick="window.print()">Штампај</button>
  <button class="print-btn" id="bg-toggle" onclick="document.body.classList.toggle('with-bg');this.textContent=document.body.classList.contains('with-bg')?'Без позадине':'Са позадином'" style="margin-left:0.75rem">Са позадином</button>
</div>

<div id="cards-container"></div>

<script>
  const CARDS_PER_PAGE = 8;

  function renderCards(guests) {
    const container = document.getElementById('cards-container');

    for (let i = 0; i < guests.length; i += CARDS_PER_PAGE) {
      const page = document.createElement('div');
      page.className = 'page';
      const slice = guests.slice(i, i + CARDS_PER_PAGE);

      slice.forEach(guest => {
        const len = guest.name.length;
        const sizeClass = len > 24 ? ' vlong' : len > 18 ? ' long' : '';
        const tableStr = guest.table ? `Сто · ${guest.table} ·` : '✦';

        const wrap = document.createElement('div');
        wrap.className = 'card-wrap';
        wrap.innerHTML = `
          <div class="card">
            <div class="card-back">
              <div class="back-ornament">✦ &nbsp; ✦ &nbsp; ✦</div>
              <div class="back-names">Милан &amp; Нина · 19. April 2026.</div>
            </div>
            <div class="fold-line"><span class="fold-label">— fold —</span></div>
            <div class="card-front">
              <div class="corner-tl"></div>
              <div class="corner-tr"></div>
              <div class="guest-name${sizeClass}">${guest.name}</div>
              <div class="name-rule"></div>
              <div class="table-label">${tableStr}</div>
            </div>
          </div>`;
        page.appendChild(wrap);
      });

      // pad to even columns
      if (slice.length % 2 !== 0) {
        const spacer = document.createElement('div');
        spacer.className = 'card-wrap';
        spacer.style.visibility = 'hidden';
        page.appendChild(spacer);
      }

      container.appendChild(page);
    }
  }

  // Flatten gosti.json groups → individual guest cards (skip children under 3)
  fetch('/data/gosti.json')
    .then(r => r.json())
    .then(groups => {
      const guests = [];
      groups.forEach(group => {
        group.guests.forEach(g => {
          // skip very young children (no card needed)
          const ageMatch = g.note && g.note.match(/^(\d+)\s*год/);
          if (ageMatch && parseInt(ageMatch[1]) < 4) return;
          guests.push({ name: g.name, table: g.table || 0 });
        });
      });
      renderCards(guests);
    })
    .catch(err => {
      document.getElementById('cards-container').innerHTML =
        `<p style="padding:2rem;color:red">Грешка при учитавању листе госта: ${err.message}</p>`;
    });
</script>

</body>
</html>
